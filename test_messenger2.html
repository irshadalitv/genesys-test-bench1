<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Genesys Cloud Form</title>

  <!-- Genesys Cloud Web Messenger -->
  <script type="text/javascript" charset="utf-8">
  (function (g, e, n, es, ys) {
    g['_genesysJs'] = e;
    g[e] = g[e] || function () {
      (g[e].q = g[e].q || []).push(arguments)
    };
    g[e].t = 1 * new Date();
    g[e].c = es;
    ys = document.createElement('script'); ys.async = 1; ys.src = n; ys.charset = 'utf-8'; document.head.appendChild(ys);
  })(window, 'Genesys', 'https://apps.aps1.pure.cloud/genesys-bootstrap/genesys.min.js', {
    environment: 'prod-aps1',
    deploymentId: '9055c77c-97db-48c7-8244-dc8e596a7861'
  });
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #ff4f1f;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #e04316;
    }
  </style>
</head>

<body>

  <div class="form-container">
    <h2>Customer Form</h2>

    <form id="customerForm">
      <input type="text" id="name" placeholder="Enter Name" required />
      <input type="email" id="email" placeholder="Enter Email" required />
      <input type="tel" id="phone" placeholder="Enter Phone Number" required />

      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    document.getElementById("customerForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;

      console.log("Form Submitted:", {
        name,
        email,
        phone
      });

      // Send data to Genesys Cloud Web Messenger
      Genesys("command", "Database.set", {
        messaging: {
          customAttributes: {
            customerName: name,
            customerEmail: email,
            customerPhone: phone
          }
        }
      });

      alert("Data sent to Genesys Cloud successfully!");

      // Optional: Open Messenger Automatically
      Genesys("command", "Messenger.open");
    });
  </script>

</body>
</html>
